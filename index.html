<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Clasificación, calendario, resultados y goleadores del campeonato de fútbol.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#12854a">
  <title>Copa Fugaz</title>

  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2312854a'/><text y='50%' x='50%' dy='.36em' text-anchor='middle' font-size='58'>⚽</text></svg>">
</head>
<body>

  <header class="cabecera">
    <div class="contenedor cabecera__fila">
      <a class="marca" href="#/">
        <span class="marca__icono" aria-hidden="true">⚽</span>
        <span id="marca-nombre">Copa Fugaz</span>
        <span class="marca__temporada" id="marca-temporada">2026</span>
      </a>

      <nav class="nav" aria-label="Secciones del sitio">
        <a class="nav__enlace" data-nav="inicio"     href="#/">Clasificación</a>
        <a class="nav__enlace" data-nav="calendario" href="#/calendario">Calendario</a>
        <a class="nav__enlace" data-nav="equipos"    href="#/equipos">Equipos</a>
        <a class="nav__enlace" data-nav="goleadores" href="#/goleadores">Goleadores</a>
        <a class="nav__enlace" data-nav="panel"      href="#/panel">Panel</a>
      </nav>

      <button class="boton-tema" id="btn-tema" type="button" aria-label="Cambiar tema">☾</button>
    </div>
  </header>

  <div id="app">
    <div class="cargando">Cargando el campeonato…</div>
  </div>

  <footer class="pie">
    <div class="contenedor pie__fila">
      <span>Copa Fugaz · Temporada <span id="pie-anio">2026</span></span>
      <span>Versión de demostración</span>
    </div>
  </footer>

  <noscript>
    <div class="contenedor" style="padding:40px 20px">
      <p>Esta web necesita JavaScript activado para mostrar la clasificación y los resultados.</p>
    </div>
  </noscript>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
